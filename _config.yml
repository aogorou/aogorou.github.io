# Academic Pages site configuration for Aoi Murakami.
locale: en-US
site_theme: default
title: Aoi Murakami
title_separator: "|"
name: Aoi Murakami
description: "Astrobiology, photosynthesis, remote sensing, and planetary environments."
url: https://aogorou.github.io
baseurl: ""
repository: aogorou/aogorou.github.io
timezone: Asia/Tokyo

author: &author
  avatar: "https://avatars.githubusercontent.com/u/95405624?v=4"
  name: "Aoi Murakami"
  bio: "Astrobiology · Photosynthesis · Planetary environments"
  location: "Osaka, Japan"
  employer: "The University of Osaka"
  github: aogorou
  researchmap: "https://researchmap.jp/mura12?lang=en"

author_ja:
  <<: *author
  name: "村上 葵 / Aoi Murakami"
  bio: "アストロバイオロジー・光合成・惑星環境"
  location: "大阪"
  employer: "大阪大学"
  researchmap: "https://researchmap.jp/mura12"

publication_category:
  manuscripts:
    title: Journal Articles
  theses:
    title: Doctoral Thesis

breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true

social:
  type: Person
  name: Aoi Murakami
  links:
    - https://github.com/aogorou
    - https://researchmap.jp/mura12

include:
  - _pages
exclude:
  - .github
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - THIRD_PARTY_NOTICES.md
  - UPSTREAM.md
  - assets/js/_main.js
  - assets/js/plugins
  - node_modules
  - package.json
  - package-lock.json
  - vendor
encoding: utf-8
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      lang: en
      comments: false
      share: false
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: true
      lang: en
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
